<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Boreal Guardian | Palo Alto Networks Cyber Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b12;
      --bg-card: #0d1424;
      --bg-card-hover: #131d33;
      --pan-orange: #fa582d;
      --pan-blue: #00c0f7;
      --accent-green: #00e676;
      --accent-amber: #ffab00;
      --accent-red: #ff3d00;
      --text-main: #e2e8f0;
      --text-muted: #8492a6;
      --border-color: #1e293b;
      --border-glow: rgba(0, 192, 247, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 192, 247, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(250, 88, 45, 0.05) 0%, transparent 40%);
    }

    header {
      background: rgba(13, 20, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-badge {
      background: linear-gradient(135deg, var(--pan-orange), #d9381e);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(250, 88, 45, 0.3);
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .hud-metrics {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .metric-card {
      background: rgba(7, 11, 18, 0.7);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      min-width: 140px;
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .metric-bar-bg {
      background: #1e293b;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .metric-bar-fill {
      height: 100%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #resilience-fill { background: var(--pan-blue); width: 85%; }
    #visibility-fill { background: var(--accent-green); width: 80%; }
    #blast-fill { background: var(--accent-red); width: 10%; }

    main {
      flex: 1;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .terminal-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .terminal-header {
      background: rgba(7, 11, 18, 0.9);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--pan-blue);
    }

    .terminal-controls {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a3854;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .scenario-body {
      padding: 32px;
    }

    .incident-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .meta-tag {
      background: rgba(0, 192, 247, 0.1);
      border: 1px solid rgba(0, 192, 247, 0.25);
      color: var(--pan-blue);
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .meta-tag.act {
      background: rgba(250, 88, 45, 0.12);
      border-color: rgba(250, 88, 45, 0.3);
      color: var(--pan-orange);
    }

    .scenario-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .scenario-narrative {
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 24px;
      white-space: pre-line;
      line-height: 1.7;
    }

    .telemetry-feed {
      background: rgba(7, 11, 18, 0.6);
      border-left: 3px solid var(--pan-orange);
      border-radius: 0 8px 8px 0;
      padding: 12px 18px;
      margin-bottom: 28px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #94a3b8;
    }

    .telemetry-feed strong {
      color: var(--pan-orange);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .choice-btn {
      background: rgba(19, 29, 51, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px 22px;
      text-align: left;
      color: #f1f5f9;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .choice-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--pan-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 192, 247, 0.15);
    }

    .choice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choice-label {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .choice-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Debrief Styles */
    .debrief-container {
      padding: 32px;
    }

    .debrief-scorecard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .score-tile {
      background: rgba(7, 11, 18, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .score-value {
      font-size: 32px;
      font-weight: 800;
      margin-top: 4px;
      font-family: 'Fira Code', monospace;
    }

    .solution-breakdown {
      margin-top: 30px;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .portfolio-card {
      background: rgba(13, 20, 36, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .portfolio-card.activated {
      border-color: rgba(0, 230, 118, 0.4);
      background: rgba(0, 230, 118, 0.04);
    }

    .portfolio-card.exposed {
      border-color: rgba(255, 61, 0, 0.4);
      background: rgba(255, 61, 0, 0.04);
    }

    .portfolio-card h4 {
      font-size: 14px;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-status {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      text-transform: uppercase;
    }

    .badge-status.active {
      background: rgba(0, 230, 118, 0.2);
      color: var(--accent-green);
    }

    .badge-status.gap {
      background: rgba(255, 61, 0, 0.2);
      color: var(--accent-red);
    }

    .portfolio-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .timeline-log {
      margin-top: 30px;
      background: rgba(7, 11, 18, 0.6);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 20px;
      max-height: 320px;
      overflow-y: auto;
    }

    .log-item {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 16px;
    }

    .log-item:last-child { border-bottom: none; }
    .log-time { color: var(--pan-blue); min-width: 90px; }
    .log-text { color: #cbd5e1; }

    .btn-restart {
      display: inline-block;
      background: linear-gradient(135deg, var(--pan-orange), #d9381e);
      color: #fff;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 24px;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(250, 88, 45, 0.3);
    }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 14px; align-items: flex-start; }
      .hud-metrics { width: 100%; justify-content: space-between; }
      .metric-card { min-width: 100px; flex: 1; }
      .scenario-body { padding: 20px; }
    }
  </style>
</head>
<body>

  <header>

    function init() {
      renderStage();
    }

    function renderStage() {
      const container = document.getElementById('dynamic-content');
      const node = scenarioGraph[appState.currentNode];

      if (!node) {
        console.error('Unknown node:', appState.currentNode);
        return;
      }

      if (node.isDebrief) {
        renderDebrief(container, node);
        return;
      }

      document.getElementById('sim-clock').textContent =
        'STAGE ' + (appState.stageCount < 10 ? '0' : '') + appState.stageCount + ' / 13 | CALGARY HQ TIME: ' + getSimTime(appState.stageCount);

      let html = '<div class="scenario-body">' +
        '<div class="incident-meta">' +
          '<div class="meta-tag act">' + escapeHtml(node.act) + '</div>' +
          '<div class="meta-tag">STATUS: ENGAGED</div>' +
        '</div>' +
        '<h2 class="scenario-title">' + escapeHtml(node.title) + '</h2>' +
        '<p class="scenario-narrative">' + escapeHtml(node.text) + '</p>' +
        '<div class="telemetry-feed">' +
          '<strong>TELEMETRY FEED: </strong>' + escapeHtml(node.telemetry) +
        '</div>' +
        '<div class="options-grid">';

      node.options.forEach(function(opt, index) {
        html += '<button class="choice-btn" onclick="makeChoice(' + index + ')">' +
          '<div class="choice-header">' +
            '<span class="choice-label">' + escapeHtml(opt.label) + '</span>' +
          '</div>' +
          '<p class="choice-desc">' + escapeHtml(opt.desc) + '</p>' +
        '</button>';
      });

      html += '</div></div>';
      container.innerHTML = html;
      updateHud();
    }

    function makeChoice(index) {
      const node = scenarioGraph[appState.currentNode];
      const opt = node.options[index];

      // Update metrics
      appState.resilience = Math.max(5, Math.min(100, appState.resilience + (opt.effects.res || 0)));
      appState.visibility = Math.max(5, Math.min(100, appState.visibility + (opt.effects.vis || 0)));
      appState.blastRadius = Math.max(5, Math.min(100, appState.blastRadius + (opt.effects.blast || 0)));

      // Record choices
      if (opt.panw) {
        if (!appState.panwPillarsActivated.includes(opt.panw)) {
          appState.panwPillarsActivated.push(opt.panw);
        }
      }
      if (opt.legacy) {
        appState.legacyExposures.push(opt.legacy);
      }
      if (opt.foothold) {
        appState.footholds.push(opt.foothold);
      }

      appState.history.push({
        stage: appState.stageCount,
        title: node.title,
        choiceLabel: opt.label,
        telemetryLog: opt.telemetryLog,
        time: getSimTime(appState.stageCount)
      });

      appState.stageCount++;
      appState.currentNode = opt.next;

      renderStage();
    }

    function renderDebrief(container, node) {
      document.getElementById('sim-clock').textContent = 'STAGE 13 / 13 | CALGARY HQ TIME: 18:00 MST | FINAL DEBRIEF';

      const panwCount = appState.panwPillarsActivated.length;

      let tierTitle = '';
      let tierColor = '';
      let tierSummary = '';

      if (panwCount >= 8 && appState.resilience >= 75) {
        tierTitle = 'TIER 1: UNIFIED PLATFORMIZATION SECURED';
        tierColor = 'var(--accent-green)';
        tierSummary = 'Boreal Core successfully established an integrated cyber defense mesh across all domains. Adversaries were detected, isolated, and neutralized at machine speed with minimal operational impact.';
      } else if (panwCount >= 5 && appState.resilience >= 50) {
        tierTitle = 'TIER 2: HYBRID RESILIENCE - SEGMENTED CONTAINMENT';
        tierColor = 'var(--pan-blue)';
        tierSummary = 'Core enterprise environments were defended by key Palo Alto Networks platforms. However, blind spots left by legacy point solutions allowed targeted footholds that required manual intervention to contain.';
      } else if (panwCount >= 3) {
        tierTitle = 'TIER 3: SEVERE OPERATIONAL COMPROMISE';
        tierColor = 'var(--accent-amber)';
        tierSummary = 'Fragmented legacy point tools created critical detection silos. While select Palo Alto Networks capabilities mitigated isolated vectors, the attacker maintained persistent footholds and exfiltrated sensitive data.';
      } else {
        tierTitle = 'TIER 4: CATASTROPHIC SYSTEMIC COMPROMISE';
        tierColor = 'var(--accent-red)';
        tierSummary = 'Pervasive reliance on legacy perimeter appliances and fragmented point solutions resulted in unchecked lateral movement, ransomware execution, and total enterprise downtime.';
      }

      let html = '<div class="debrief-container">' +
        '<div class="incident-meta">' +
          '<div class="meta-tag act">' + escapeHtml(node.act) + '</div>' +
          '<div class="meta-tag" style="border-color:' + tierColor + '; color:' + tierColor + ';">' + escapeHtml(tierTitle) + '</div>' +
        '</div>' +
        '<h2 class="scenario-title" style="color:' + tierColor + ';">' + escapeHtml(tierTitle) + '</h2>' +
        '<p class="scenario-narrative">' + escapeHtml(tierSummary) + '</p>' +

        '<div class="debrief-scorecard">' +
          '<div class="score-tile">' +
            '<div class="metric-label">Resilience</div>' +
            '<div class="score-value" style="color:var(--pan-blue);">' + appState.resilience + '%</div>' +
          '</div>' +
          '<div class="score-tile">' +
            '<div class="metric-label">Threat Visibility</div>' +
            '<div class="score-value" style="color:var(--accent-green);">' + appState.visibility + '%</div>' +
          '</div>' +
          '<div class="score-tile">' +
            '<div class="metric-label">Blast Radius</div>' +
            '<div class="score-value" style="color:var(--accent-red);">' + appState.blastRadius + '%</div>' +
          '</div>' +
          '<div class="score-tile">' +
            '<div class="metric-label">Platform Solutions</div>' +
            '<div class="score-value" style="color:#fff;">' + panwCount + ' / 9</div>' +
          '</div>' +
        '</div>';

      // Architectural Breakdown
      html += '<div class="solution-breakdown">' +
        '<h3 style="font-size:18px; margin-bottom:12px; color:#fff;">Comprehensive Architectural Balance Sheet</h3>' +
        '<div class="portfolio-grid">';

      Object.keys(portfolioMaster).forEach(function(key) {
        const item = portfolioMaster[key];
        const isActivated = appState.panwPillarsActivated.includes(key);

        html += '<div class="portfolio-card ' + (isActivated ? 'activated' : 'exposed') + '">' +
          '<h4>' + escapeHtml(key) +
            '<span class="badge-status ' + (isActivated ? 'active' : 'gap') + '">' +
              (isActivated ? 'Activated' : 'Gap') +
            '</span>' +
          '</h4>' +
          '<div style="font-size:11px; color:var(--pan-blue); margin-bottom:6px; font-family:\'Fira Code\', monospace;">' + escapeHtml(item.role) + '</div>' +
          '<p>' + (isActivated ? escapeHtml(item.benefit) : 'Not adopted during simulation. Adversaries exploited operational gaps in this domain.') + '</p>' +
        '</div>';
      });

      html += '</div></div>';

      // Forensic Log
      html += '<div class="timeline-log">' +
        '<h4 style="font-size:14px; color:#fff; margin-bottom:12px; font-family:\'Fira Code\', monospace;">INCIDENT TIMELINE AUDIT</h4>';

      appState.history.forEach(function(item) {
        html += '<div class="log-item">' +
          '<span class="log-time">' + escapeHtml(item.time) + '</span>' +
          '<span class="log-text">' + escapeHtml(item.telemetryLog) + '</span>' +
        '</div>';
      });

      html += '</div>';

      // Restart Action
      html += '<div style="text-align:center;">' +
        '<button class="btn-restart" onclick="restartSimulation()">RUN NEW ADVERSARIAL CAMPAIGN</button>' +
      '</div>';

      html += '</div>';
      container.innerHTML = html;
      updateHud();
    }

    function restartSimulation() {
      appState.currentNode = 's1_recon';
      appState.stageCount = 1;
      appState.resilience = 85;
      appState.visibility = 80;
      appState.blastRadius = 10;
      appState.history = [];
      appState.panwPillarsActivated = [];
      appState.legacyExposures = [];
      appState.footholds = [];
      renderStage();
    }

    function updateHud() {
      document.getElementById('resilience-val').textContent = appState.resilience + '%';
      document.getElementById('resilience-fill').style.width = appState.resilience + '%';

      document.getElementById('visibility-val').textContent = appState.visibility + '%';
      document.getElementById('visibility-fill').style.width = appState.visibility + '%';

      document.getElementById('blast-val').textContent = appState.blastRadius + '%';
      document.getElementById('blast-fill').style.width = appState.blastRadius + '%';
    }

    function getSimTime(stage) {
      const times = [
        '08:15 MST', '09:00 MST', '09:45 MST', '10:30 MST',
        '11:15 MST', '12:00 MST', '12:45 MST', '13:30 MST',
        '14:15 MST', '15:00 MST', '15:45 MST', '16:30 MST',
        '17:15 MST', '18:00 MST'
      ];
      return times[stage - 1] || '18:00 MST';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
    }
  </script>
